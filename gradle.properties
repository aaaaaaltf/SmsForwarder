# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# ★ JDK 16+ 模块系统：kapt 在 Gradle worker 进程内运行，需在 org.gradle.jvmargs 顶层添加 add-exports，
#   同时给 kotlin daemon 也加一份（否则 kaptGenerateStubs 报 IllegalAccessError: jdk.compiler 不导出）
# ★ 2026-08-05：-Xmx16g 在16GB内存机器上导致 kapt 编译器 OOM(Internal compiler error)，降为 4g
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# ★ 2026-08-10 修复：移除自定义JDK配置，使用批处理文件设置的 JAVA_HOME (JDK 17)
# C:/temp/custom_jdk 是 JRE 而非 JDK，导致 JDK Image Transform 失败
# 批处理文件设置 JAVA_HOME=E:\Andorid Studio\jdk-17.0.2 (完整 JDK 17)
# org.gradle.java.home=C:/temp/custom_jdk
# ★ 禁用 JDK Image Transform (AGP 8.x 需要 jlink/javac，JRE 不支持)
android.experimental.disableJdkImageTransform=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# ★ kotlin 编译在 Gradle 进程内执行（避免独立 kotlin daemon 在受限环境下的 tmp 文件访问问题）
kotlin.compiler.execution.strategy=in-process
# ★ 强制使用 SDK 自带 aapt2（AGP 从 jar 提取的 aapt2 daemon 在受限环境启动失败，SDK aapt2 已验证可用）
android.aapt2FromMavenOverride=C:/Users/Administrator/AppData/Local/Android/Sdk/build-tools/33.0.2/aapt2.exe
# 是否打包APK，打正式包时请设置为true,使用正式的签名
isNeedPackage=true
isNeedClean=true
# 是否排除Frpc动态库，打正式包时请设置为true
excludeFrpclib=true
# 是否使用leakcanary检测内存泄漏，打正式包时请设置为false
isNeedLeakcanary=false
# 是否使用booster优化APK，这里需要注意gradle的版本，对于最新的gradle版本可能存在兼容问题
isUseBooster=false
android.precompileDependenciesResources=false
android.useAndroidX=true
android.enableJetifier=true
#android.enableD8=true
# 禁止 Android Gradle Plugin 的 Transform API 警告
android.debug.obsoleteApi=false
# 可选：抑制其他不必要的警告
android.suppressUnsupportedCompileSdk=33
# 禁止 R8 显示 stack map table 警告
android.enableR8.fullMode=false
android.enableR8.r8FullMode=false
org.gradle.warning.mode=none
# 禁用 native debug metadata
android.extractNativeDebugMetadata=false
# 关闭 symbol 处理
android.experimental.enableNativeSymbolTables=false
android.overridePathCheck=true

//閼奉亜濮╁ǎ璇插XAOP閸滃Router閹绘帊娆?project.buildscript.configurations.each { configuration ->
    def dependencies = getProject().dependencies
    //noinspection ChangeToOperator
    if (configuration.name.equals("classpath")) {
        //XAOP閹绘帊娆?        configuration.dependencies.add(dependencies.create(deps.xlibrary.xaop_plugin))
        //XRouter閹绘帊娆?        configuration.dependencies.add(dependencies.create(deps.xlibrary.xrouter_plugin))
        //AspectJX
        //configuration.dependencies.add(dependencies.create('com.hujiang.aspectjx:gradle-android-plugin-aspectjx:2.0.10'))
        //kotlin閹绘帊娆?        configuration.dependencies.add(dependencies.create("org.jetbrains.kotlin:kotlin-gradle-plugin:$versions.kotlin"))
    }
}
